<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,follow" />
    <title>ページが見つかりません | GeminiHall</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #18212f; background: #f6f8fb; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      main { width: min(100%, 560px); padding: 40px; border: 1px solid #dce3ed; border-radius: 18px; background: #fff; box-shadow: 0 16px 48px rgb(24 33 47 / 8%); }
      p { color: #536174; line-height: 1.75; }
      a { display: inline-block; margin-top: 12px; padding: 11px 16px; border-radius: 8px; background: #183b66; color: #fff; text-decoration: none; }
      a:focus-visible { outline: 3px solid #f5b942; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <p>GeminiHall</p>
      <h1>ページが見つかりません</h1>
      <p>お探しのページは移動または削除された可能性があります。</p>
      <a href="/">トップページへ戻る</a>
    </main>
  </body>
</html>
