<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>GeminiHall ログイン</title>
    <style>
      :root { --bg: #f7f7f5; --text: #1d1d1b; --muted: #5f5f5a; color-scheme: light; }
      @media (prefers-color-scheme: dark) { :root { --bg: #161615; --text: #ececea; --muted: #a3a39d; color-scheme: dark; } }
      body { margin: 0; padding: 48px 16px; background: var(--bg); color: var(--text); font: 15px/1.7 system-ui, -apple-system, "Hiragino Sans", sans-serif; text-align: center; }
      p { max-width: 480px; margin: 8px auto; }
      .muted { color: var(--muted); font-size: 13px; }
    </style>
  </head>
  <body>
    <p id="message">ログインを確認しています…</p>
    <p class="muted">このタブは自動で閉じます。閉じない場合は、閉じて GeminiHall のパネルに戻ってください。</p>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
