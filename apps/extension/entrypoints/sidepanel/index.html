<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GeminiHall</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="app-header">
      <h1>GeminiHall</h1>
      <span id="mode-badge" class="badge badge-live">LIVE</span>
    </header>

    <details id="settings" class="panel">
      <summary>設定（使うAIとAPIキー）</summary>
      <form id="settings-form" autocomplete="off">
        <label class="field">
          <span>使うAI</span>
          <select id="provider">
            <option value="ANTHROPIC">Claude（Anthropic）</option>
            <option value="OPENAI">ChatGPT（OpenAI API）</option>
          </select>
        </label>
        <label class="field">
          <span>モデル名</span>
          <input id="model" type="text" spellcheck="false" />
        </label>
        <label class="field">
          <span>APIキー</span>
          <input id="api-key" type="password" spellcheck="false" placeholder="未設定" />
        </label>
        <p id="key-status" class="hint"></p>
        <p class="hint">
          キーはこのブラウザのセッション内だけに保存し、GeminiHall のサーバーへは送りません。ブラウザを閉じると消えるため、再起動後はもう一度入力してください。監査の利用料は、あなたのアカウントに請求されます。
        </p>
        <div class="row">
          <button type="submit" class="primary">保存</button>
          <button type="button" id="clear-key">このAIのキーを消す</button>
        </div>
      </form>
    </details>

    <section class="panel">
      <label class="field">
        <span>監査する主張</span>
        <textarea id="claim" rows="5" maxlength="4000" placeholder="AIの回答のうち、確かめたい文章を貼り付けてください。"></textarea>
      </label>
      <label class="field">
        <span>文脈（任意）</span>
        <textarea id="context" rows="2" maxlength="2000" placeholder="質問の内容など、主張の前提になる情報"></textarea>
      </label>
      <button id="run" class="primary">監査する</button>
      <p id="input-error" class="error" hidden></p>
    </section>

    <section id="status" class="panel" hidden></section>
    <section id="result" hidden></section>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
